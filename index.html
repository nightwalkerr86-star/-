<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>រាសី · លោកគ្រូទាយ</title>
<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&family=Kantumruy+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Title font: Kh Ang Toathmor Kbach (local file). Used for the logo, reading title, zodiac year and share card heading */
  @font-face { font-family:'KhAngKbach'; src:url('assets/fonts/kh-ang-toathmor-kbach.ttf') format('truetype'); font-display:swap; }
  :root { --gold:#e8c27a; --red:#7a1414; --ink:#0a0505; --text:#f3e6cf; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#000; color:var(--text); font-family:'Kantumruy Pro',sans-serif; overflow:hidden; }
  #stage { position:relative; height:100%; max-width:calc(100vh * 9 / 16); margin:0 auto; overflow:hidden; background:var(--ink); }

  /* Background layers: image if present, else painted gradient fallback */
  .bg { position:absolute; inset:-6%; background-size:cover; background-position:center; opacity:0; transition:opacity 1.6s ease; animation:drift 24s ease-in-out infinite alternate; }
  .bg.on { opacity:1; }
  @keyframes drift { from { transform:scale(1) translateY(0); } to { transform:scale(1.08) translateY(-2%); } }
  @media (prefers-reduced-motion: reduce) { .bg { animation:none; } }
  #stage { touch-action:pan-y; user-select:none; -webkit-user-select:none; }
  #lookHint { position:absolute; top:4%; left:0; right:0; text-align:center; font-size:13px; color:rgba(255,248,236,.75); text-shadow:0 1px 8px #000; opacity:0; transition:opacity .8s; pointer-events:none; z-index:3; }
  #lookHint.on { opacity:1; animation:sway 2.4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform:translateX(-10px); } 50% { transform:translateX(10px); } }
  .fallback-hall {
    background:
      radial-gradient(ellipse 30% 22% at 50% 42%, rgba(255,190,90,.55), transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 45%, rgba(140,30,20,.5), transparent 75%),
      linear-gradient(90deg, #120404 0 14%, #2a0a07 14% 18%, #120404 18% 82%, #2a0a07 82% 86%, #120404 86%),
      linear-gradient(#0b0303, #1c0705 60%, #0b0303);
  }
  .fallback-altar {
    background:
      radial-gradient(circle at 50% 38%, rgba(255,210,120,.8) 0 6%, rgba(230,150,50,.35) 14%, transparent 34%),
      radial-gradient(ellipse 50% 30% at 50% 70%, rgba(120,25,15,.6), transparent 70%),
      linear-gradient(#070202, #1d0805 55%, #070202);
  }
  .vignette { position:absolute; inset:0; background:radial-gradient(ellipse 85% 70% at 50% 46%, transparent 34%, rgba(0,0,0,.3) 68%, rgba(0,0,0,.82) 100%); pointer-events:none; }

  canvas#fx { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* Character */
  /* Explore scene: a wide world you walk through by tapping (3rd person) */
  #world { position:absolute; top:0; left:0; height:100%; opacity:0; visibility:hidden; transition:opacity 1.2s ease, visibility 0s 1.2s; will-change:transform; cursor:pointer; }
  #world.on { opacity:1; visibility:visible; transition:opacity 1.2s ease; }
  #worldImg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #player { position:absolute; aspect-ratio:0.42; transform:translate(-50%,-100%); pointer-events:none; }
  #player img { width:100%; height:100%; object-fit:contain; object-position:bottom; filter:drop-shadow(0 0 14px rgba(0,0,0,.7)); }
  #player::after { content:''; position:absolute; left:-20%; right:-20%; bottom:-4%; height:9%; border-radius:50%; background:radial-gradient(ellipse, rgba(0,0,0,.65), transparent 70%); z-index:-1; }
  #player.lantern::after { background:radial-gradient(ellipse, rgba(255,180,80,.45), transparent 70%); left:-60%; right:-60%; height:14%; }
  #player .orb { position:absolute; left:50%; bottom:40%; width:46%; aspect-ratio:1; transform:translateX(-50%); border-radius:50%; background:radial-gradient(circle, #fff6d0 0 16%, rgba(255,195,95,.95) 38%, rgba(255,150,40,0) 72%); box-shadow:0 0 44px 14px rgba(255,180,80,.35); }
  .spot { position:absolute; width:48px; height:48px; transform:translate(-50%,-50%); border-radius:50%; }
  .spot::before { content:''; position:absolute; inset:15px; border-radius:50%; background:#ffe2a0; box-shadow:0 0 14px 5px rgba(255,200,110,.75); }
  .spot::after { content:''; position:absolute; inset:6px; border-radius:50%; border:1px solid rgba(255,220,150,.8); animation:ring 2s ease-out infinite; }
  .spot.seen::before { background:rgba(255,226,160,.45); box-shadow:none; } .spot.seen::after { animation:none; opacity:.25; }
  @keyframes ring { from { transform:scale(.5); opacity:1; } to { transform:scale(1.25); opacity:0; } }
  #exHint { position:absolute; top:4%; left:6%; right:6%; text-align:center; font-size:13px; color:rgba(255,248,236,.8); text-shadow:0 1px 8px #000; opacity:0; transition:opacity .8s; pointer-events:none; z-index:3; }
  #exHint.on { opacity:1; }
  #charVid { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center top; opacity:0; transition:opacity 1.4s ease; pointer-events:none; }
  #charVid.on { opacity:1; }
  #char { position:absolute; left:0; right:0; bottom:0; height:78%; display:flex; justify-content:center; align-items:flex-end; opacity:0; transform:translateY(20px); transition:opacity 1.4s ease, transform 1.4s ease; pointer-events:none; }
  #char.on { opacity:1; transform:none; }
  #char img { height:100%; object-fit:contain; object-position:bottom; filter:drop-shadow(0 0 30px rgba(0,0,0,.8)); }
  #char .silhouette { width:62%; height:92%; background:
      radial-gradient(ellipse 22% 13% at 50% 16%, #1b0d0a 98%, transparent 100%),
      radial-gradient(ellipse 50% 60% at 50% 85%, #1b0d0a 98%, transparent 100%);
    filter:drop-shadow(0 0 18px rgba(232,194,122,.35)); }

  /* Text */
  #line { position:absolute; left:8%; right:8%; top:46%; text-align:center; font-family:'Battambang',serif; font-size:clamp(22px,6.4vh,34px); line-height:1.3; text-shadow:0 2px 14px #000, 0 0 2px #000; opacity:0; transition:opacity .9s ease; pointer-events:none; }
  #line.on { opacity:1; }
  #line.low { top:auto; bottom:22%; }
  #line.top { top:auto; bottom:39%; font-size:clamp(20px,5vh,28px); }
  #line .who { display:block; font-family:'Kantumruy Pro'; font-size:12px; letter-spacing:.25em; text-transform:uppercase; color:var(--gold); margin-bottom:8px; }

  #choices { position:absolute; left:8%; right:8%; bottom:9%; display:flex; flex-direction:column; gap:10px; }
  /* Frosted glass buttons */
  .btn { position:relative; overflow:hidden; color:#fff8ec; padding:15px 22px; border-radius:40px; font:500 15px 'Kantumruy Pro'; letter-spacing:.02em; cursor:pointer; opacity:0; animation:fadeIn .7s ease forwards;
    background:linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.28); border-top-color:rgba(255,255,255,.5);
    -webkit-backdrop-filter:blur(16px) saturate(160%); backdrop-filter:blur(16px) saturate(160%);
    box-shadow:0 8px 28px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.06);
    text-shadow:0 1px 6px rgba(0,0,0,.5); transition:transform .15s ease, background .2s ease, box-shadow .2s ease; }
  .btn::before { content:''; position:absolute; inset:0 0 50% 0; border-radius:40px 40px 50% 50%; background:linear-gradient(rgba(255,255,255,.18), transparent); pointer-events:none; }
  .btn:hover { background:linear-gradient(135deg, rgba(255,230,180,.22), rgba(255,255,255,.06)); box-shadow:0 10px 32px rgba(0,0,0,.5), 0 0 22px rgba(232,194,122,.25), inset 0 1px 0 rgba(255,255,255,.45); }
  .btn:active { transform:scale(.97); background:linear-gradient(135deg, rgba(232,194,122,.3), rgba(255,255,255,.08)); }
  @keyframes fadeIn { to { opacity:1; } }

  #form { position:absolute; left:8%; right:8%; bottom:9%; display:none; flex-direction:column; gap:12px; }
  #form.on { display:flex; animation:fadeIn .8s ease; }
  #form input { background:linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.03)); border:1px solid rgba(255,255,255,.25); border-top-color:rgba(255,255,255,.42); -webkit-backdrop-filter:blur(16px) saturate(160%); backdrop-filter:blur(16px) saturate(160%); box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 6px 20px rgba(0,0,0,.35); color:#fff8ec; padding:14px 22px; border-radius:40px; font:16px 'Kantumruy Pro'; color-scheme:dark; outline:none; }
  #form input::placeholder { color:rgba(255,248,236,.55); }
  #form input:focus { border-color:rgba(232,194,122,.7); box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 0 18px rgba(232,194,122,.25); }

  #reading { position:absolute; inset:0; overflow-y:auto; padding:18% 8% 14%; display:none; background:linear-gradient(rgba(8,3,2,.2), rgba(8,3,2,.92) 30%); }
  #reading.on { display:block; animation:fadeIn 1.2s ease; }
  #reading h2 { font-family:'Moul'; font-size:22px; line-height:1.6; color:var(--gold); text-align:center; }
  #reading .day { text-align:center; font-size:12px; letter-spacing:.25em; text-transform:uppercase; opacity:.75; margin:6px 0 22px; }
  #reading h3 { font:500 12px 'Kantumruy Pro'; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); margin:18px 0 6px; }
  #reading p { font-family:'Battambang'; font-size:20px; line-height:1.45; }
  #reading .zodiac { display:flex; align-items:center; justify-content:center; gap:14px; margin:4px 0 10px; padding:12px; border:1px solid rgba(232,194,122,.35); border-radius:14px; background:rgba(122,20,20,.18); }
  #reading .zodiac span { font-size:38px; width:96px; height:96px; flex:none; display:flex; align-items:center; justify-content:center; background:url('assets/zodiac-frame.svg') center / contain no-repeat; }
  #reading .zodiac span img { width:60%; height:60%; object-fit:contain; filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
  #reading .zodiac b { display:block; font-family:'Moul'; font-size:17px; color:var(--gold); }
  #reading .zodiac i { font:12px 'Kantumruy Pro'; letter-spacing:.2em; text-transform:uppercase; opacity:.7; font-style:normal; }
  #reading .note { font:12px 'Kantumruy Pro'; opacity:.55; text-align:center; margin-top:28px; }

  #tap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(0,0,0,.6); z-index:5; cursor:pointer; font-family:'Battambang'; font-size:22px; text-align:center; }
  #tap small { font:12px 'Kantumruy Pro'; letter-spacing:.2em; opacity:.6; animation:pulse 2s infinite; }
  @keyframes pulse { 50% { opacity:.2; } }
  #skip { position:absolute; bottom:3%; left:0; right:0; text-align:center; font-size:12px; opacity:.5; z-index:4; cursor:pointer; }
  #hint { position:absolute; bottom:5.5%; left:0; right:0; text-align:center; font-size:11px; letter-spacing:.2em; opacity:0; transition:opacity .6s; }
  #hint.on { opacity:.45; animation:pulse 2s infinite; }
  /* Khmer script: no letter-spacing (it breaks vowel/subscript shaping), taller lines, slightly smaller story text */
  #line .who, #hint, #tap small, #reading .day, #reading h3, #reading .zodiac i, .btn { letter-spacing:0 !important; text-transform:none !important; }
  #line { font-size:clamp(18px,4.6vh,26px); line-height:1.75; }
  #line.top { font-size:clamp(17px,4vh,23px); }
  #reading p { font-size:17px; line-height:1.9; }
  #reading h3 { font-size:14px; }
  #tap { font-family:'Moul'; font-size:20px; line-height:1.8; }
  /* ---------- Atmosphere: dark red grade, flickering candle glow, drifting incense haze, film grain ---------- */
  #grade, #fog, #grain { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  #grade { background:linear-gradient(rgba(70,14,10,.38), rgba(120,40,24,.06) 46%, rgba(40,8,6,.5)); mix-blend-mode:multiply; }
  #grade::after { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 75% 42% at 50% 47%, rgba(255,160,70,.42), rgba(200,50,25,.14) 55%, transparent 75%); mix-blend-mode:screen; animation:flicker 3.4s linear infinite; }
  @keyframes flicker { 0%,100% { opacity:.9; } 7% { opacity:.6; } 11% { opacity:1; } 29% { opacity:.72; } 33% { opacity:.95; } 54% { opacity:.62; } 59% { opacity:1; } 81% { opacity:.78; } }
  #fog::before, #fog::after { content:''; position:absolute; left:-50%; width:200%; height:55%; filter:blur(14px);
    background:radial-gradient(ellipse 30% 40% at 20% 60%, rgba(215,185,165,.13), transparent 70%), radial-gradient(ellipse 35% 35% at 58% 40%, rgba(215,185,165,.10), transparent 70%), radial-gradient(ellipse 25% 45% at 86% 68%, rgba(215,185,165,.12), transparent 70%); }
  #fog::before { top:30%; animation:fogdrift 40s ease-in-out infinite alternate; }
  #fog::after  { top:52%; animation:fogdrift 56s ease-in-out infinite alternate-reverse; }
  @keyframes fogdrift { from { transform:translateX(-14%); } to { transform:translateX(14%); } }
  #grain { opacity:.16; mix-blend-mode:overlay; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  @media (prefers-reduced-motion: reduce) { #grade::after, #fog::before, #fog::after { animation:none; } }
  /* Narration sits in a quiet caption box near the bottom; the fortune teller's own words stay large */
  #line.box { top:auto; bottom:12%; left:7%; right:7%; padding:14px 18px; border-radius:20px; font-size:clamp(15px,2.2vh,18px); line-height:1.85; text-shadow:none;
    background:rgba(16,6,5,.6); border:1px solid rgba(255,255,255,.13); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); box-shadow:0 10px 30px rgba(0,0,0,.5); }
  #line.box.haschoices { bottom:27%; }
  /* Link out to the full fortune site */
  #reading .cta { display:block; margin:26px 0 0; padding:15px 20px; border-radius:40px; text-align:center; text-decoration:none; font:700 16px 'Kantumruy Pro'; color:#3a1206;
    background:linear-gradient(180deg, #f6d98a, #d9a441 60%, #b9812a); border:1px solid rgba(255,236,180,.8); box-shadow:0 8px 26px rgba(0,0,0,.5), 0 0 22px rgba(232,194,122,.3), inset 0 1px 0 rgba(255,255,255,.6); }
  #reading .cta small { display:block; margin-top:4px; font:400 11.5px 'Kantumruy Pro'; color:rgba(58,18,6,.75); }
  #reading .cta:active { transform:scale(.98); }
  /* Reasey scene (embedded site) */
  #site { position:absolute; inset:0; z-index:10; display:flex; flex-direction:column; background:#1a0505; transform:translateY(100%); visibility:hidden; transition:transform .6s cubic-bezier(.2,.8,.2,1), visibility 0s .6s; }
  #site.on { transform:none; visibility:visible; transition:transform .6s cubic-bezier(.2,.8,.2,1); }
  #siteBar { flex:none; display:flex; align-items:center; justify-content:space-between; padding:calc(8px + env(safe-area-inset-top)) 14px 8px; background:linear-gradient(#3a0d0a, #240706); border-bottom:1px solid rgba(232,194,122,.35); }
  #siteBar span { font-family:'Moul'; font-size:15px; color:var(--gold); }
  #siteBack { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.22); color:#fff8ec; padding:8px 14px; border-radius:40px; font:500 13px 'Kantumruy Pro'; cursor:pointer; }
  #site { overflow:hidden; }
  #siteFrame { flex:1; width:calc(100% + 20px); border:0; background:#1a0505; }   /* push Reasey's own scrollbar just off-screen */
  /* ---------- Reasey theme: deep maroon, crimson glow, gold accents, cream text ---------- */
  :root { --gold:#e9c46a; --text:#f6ead2; --ink:#1c0606; --maroon:#3a0c0c; }
  html,body { background:#120303; }
  #stage { background:radial-gradient(ellipse at 50% 30%, #5c1212, #2a0808 55%, #140404); }
  .vignette { background:radial-gradient(ellipse 85% 70% at 50% 46%, transparent 34%, rgba(30,4,4,.35) 68%, rgba(18,3,3,.86) 100%); }
  #grade { background:linear-gradient(rgba(120,20,18,.42), rgba(160,44,30,.10) 46%, rgba(80,12,12,.55)); }
  #tap { background:radial-gradient(ellipse at 50% 42%, rgba(120,22,20,.78), rgba(22,4,4,.94)); color:var(--gold); }
  #tap small { color:var(--text); }
  .btn { color:var(--text); background:linear-gradient(180deg, rgba(98,22,20,.9), rgba(54,11,11,.92)); border:1px solid rgba(233,196,106,.55); border-top-color:rgba(245,214,140,.8);
    box-shadow:0 8px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,225,160,.22); text-shadow:none; }
  .btn::before { background:linear-gradient(rgba(255,220,150,.10), transparent); }
  .btn:hover { background:linear-gradient(180deg, rgba(122,28,24,.92), rgba(66,13,13,.94)); box-shadow:0 10px 28px rgba(0,0,0,.5), 0 0 20px rgba(233,196,106,.28), inset 0 1px 0 rgba(255,225,160,.3); }
  .btn:active { background:linear-gradient(180deg, rgba(140,36,28,.95), rgba(80,16,16,.95)); }
  #go, #go:hover, #go:active { color:#3a1206; font-weight:700; background:linear-gradient(180deg, #f6d98a, #d9a441 60%, #b9812a); border:1px solid rgba(255,236,180,.85);
    box-shadow:0 8px 26px rgba(0,0,0,.5), 0 0 22px rgba(233,196,106,.3), inset 0 1px 0 rgba(255,255,255,.6); }
  #go::before { background:linear-gradient(rgba(255,255,255,.28), transparent); }
  #form input { background:rgba(48,10,10,.86); border:1px solid rgba(233,196,106,.42); border-top-color:rgba(233,196,106,.6); box-shadow:inset 0 2px 6px rgba(0,0,0,.35); color:var(--text); }
  #form input::placeholder { color:rgba(246,234,210,.5); }
  #form input:focus { border-color:var(--gold); box-shadow:inset 0 2px 6px rgba(0,0,0,.35), 0 0 16px rgba(233,196,106,.3); }
  #line.box { background:rgba(52,11,11,.8); border:1px solid rgba(233,196,106,.38); }
  #reading { background:linear-gradient(rgba(44,9,9,.35), rgba(36,7,7,.96) 30%); }
  #reading .zodiac { background:linear-gradient(180deg, rgba(92,20,18,.8), rgba(58,12,12,.85)); border:1px solid rgba(233,196,106,.55); border-radius:18px; }
  #siteBack { background:rgba(233,196,106,.1); border:1px solid rgba(233,196,106,.5); color:var(--gold); }
  #skip { color:var(--text); }
  /* ---------- Incense offering ---------- */
  #incense { position:absolute; inset:0; z-index:4; opacity:0; visibility:hidden; transition:opacity .9s ease, visibility 0s .9s; background:radial-gradient(ellipse 80% 50% at 50% 78%, rgba(60,10,8,.25), rgba(14,3,3,.72)); }
  #incense.on { opacity:1; visibility:visible; transition:opacity .9s ease; }
  #incTitle { position:absolute; top:13%; left:8%; right:8%; text-align:center; font-family:'Battambang',serif; font-size:clamp(17px,2.6vh,21px); line-height:1.8; color:var(--text); text-shadow:0 2px 12px #000; }
  #incSet { position:absolute; left:50%; bottom:11%; width:min(62%,260px); aspect-ratio:1/1.75; transform:translateX(-50%); }
  #urn { position:absolute; left:8%; right:8%; bottom:0; height:27%; border-radius:46% 46% 50% 50% / 26% 26% 74% 74%; border:1px solid rgba(255,230,160,.7);
    background:radial-gradient(ellipse 60% 26% at 50% 9%, #3b2412 0 96%, transparent 100%), linear-gradient(90deg, #7a4a12, #e9c46a 28%, #f8e2a0 48%, #c9953a 72%, #6e3f0e);
    box-shadow:0 14px 30px rgba(0,0,0,.6), inset 0 -10px 18px rgba(80,40,6,.55); }
  #urn::after { content:''; position:absolute; left:26%; right:26%; bottom:-9%; height:16%; border-radius:0 0 40% 40%; background:linear-gradient(90deg, #6e3f0e, #d9a441 45%, #6e3f0e); }
  .stick { position:absolute; bottom:22%; left:50%; width:48px; height:74%; margin-left:-24px; transform:rotate(var(--r)); transform-origin:50% 100%; cursor:pointer; }
  .stick::before { content:''; position:absolute; left:50%; top:3%; bottom:0; width:5px; margin-left:-2.5px; border-radius:3px; background:linear-gradient(#caa26a 0 62%, #a51b1b 62%); box-shadow:0 0 6px rgba(0,0,0,.6); }
  .stick b { position:absolute; left:50%; top:1.5%; width:11px; height:11px; margin-left:-5.5px; border-radius:50%; background:#5b4630; transition:background .5s, box-shadow .5s; }
  .stick:not(.lit) b { animation:beckon 1.8s ease-in-out infinite; }
  @keyframes beckon { 50% { box-shadow:0 0 0 7px rgba(233,196,106,.22); } }
  .stick.lit b { background:radial-gradient(circle, #fff6c8 0 25%, #ff9a2e 60%, #d6480c); box-shadow:0 0 14px 5px rgba(255,140,40,.75); animation:ember 1.3s ease-in-out infinite; }
  @keyframes ember { 50% { box-shadow:0 0 20px 8px rgba(255,150,50,.9); } }
  .stick i { position:absolute; left:50%; top:0; width:26px; height:26px; margin-left:-13px; border-radius:50%; background:radial-gradient(circle, rgba(235,225,215,.5), transparent 68%); filter:blur(5px); opacity:0; }
  .stick.lit i { animation:smoke 4.2s ease-out infinite; }
  .stick.lit i:nth-of-type(2) { animation-delay:1.05s; } .stick.lit i:nth-of-type(3) { animation-delay:2.1s; } .stick.lit i:nth-of-type(4) { animation-delay:3.15s; }
  @keyframes smoke { 0% { transform:translate(0,0) scale(.5); opacity:0; } 12% { opacity:.75; } 55% { transform:translate(14px,-110px) scale(1.7); opacity:.4; } 100% { transform:translate(-12px,-230px) scale(3); opacity:0; } }
  /* Share card + buttons inside the reading, and the walk-around back button */
  #cardImg { display:block; width:100%; margin:28px auto 6px; border-radius:2.9% / 2.3%; box-shadow:0 12px 34px rgba(0,0,0,.6); }
  #reading .btn { display:block; width:100%; margin-top:12px; }
  #exHint { top:9.5%; }
  #exBack { position:absolute; top:3%; left:4%; z-index:4; display:none; background:rgba(40,8,8,.7); border:1px solid rgba(233,196,106,.5); color:var(--gold); padding:8px 14px; border-radius:40px; font:500 13px 'Kantumruy Pro'; cursor:pointer; }

  /* ---------- Landing screen: the character, one line, one button ---------- */

  #tap .hook small { font:12px 'Kantumruy Pro'; color:rgba(246,234,210,.6); letter-spacing:0; animation:none; }
  #enterBtn, #enterBtn:hover, #enterBtn:active { color:#3a1206; font-weight:700; font-size:17px; background:linear-gradient(180deg, #f6d98a, #d9a441 60%, #b9812a); border:1px solid rgba(255,236,180,.85);
    box-shadow:0 8px 26px rgba(0,0,0,.5), 0 0 26px rgba(233,196,106,.35), inset 0 1px 0 rgba(255,255,255,.6); }
  /* ---------- Questions over the blurred character ---------- */
  #stage.asking #charVid, #stage.asking #char, #stage.asking .bg { filter:blur(9px) brightness(.5); }
  #charVid, #char { transition:opacity 1.4s ease, filter .8s ease; }
  #form .q { display:none; flex-direction:column; gap:12px; }

  #form h4 { font:700 clamp(21px,3.2vh,26px)/1.7 'Battambang',serif; color:var(--text); text-shadow:0 2px 12px #000; margin-bottom:6px; }
  #form .qBack { align-self:center; margin-top:4px; font:13px 'Kantumruy Pro'; color:rgba(246,234,210,.6); cursor:pointer; }
  /* Second character clip: he writes on the palm-leaf manuscript while asking for the birth details */
  #writeVid { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center top; opacity:0; transition:opacity 1.4s ease, filter .8s ease; pointer-events:none; }
  #writeVid.on { opacity:1; }
  #stage.asking #writeVid { filter:blur(9px) brightness(.5); }
  /* ---------- Fortune teller's house (no temple imagery): candle-lit dark room until a room image is added ---------- */
  .fallback-hall, .fallback-altar { background:
      radial-gradient(ellipse 16% 9% at 20% 63%, rgba(255,175,85,.38), transparent 70%),
      radial-gradient(ellipse 14% 8% at 82% 58%, rgba(255,175,85,.32), transparent 70%),
      radial-gradient(ellipse 10% 6% at 60% 70%, rgba(255,175,85,.22), transparent 70%),
      radial-gradient(ellipse 75% 46% at 50% 44%, rgba(124,28,22,.55), transparent 76%),
      linear-gradient(#150505, #2c0b09 60%, #120404); }
  #incense { background:radial-gradient(ellipse 72% 42% at 50% 80%, rgba(120,26,20,.6), rgba(18,4,4,.97) 76%), #140404; }
  /* Third character clip: he reads your fate after the incense (plays once, then holds its last frame behind the reading) */
  #fateVid { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center top; opacity:0; transition:opacity 1.2s ease; pointer-events:none; }
  #fateVid.on { opacity:1; }
  /* Opening: the camera walks in through the door once, then holds on the table and cloth */
  #roomVid { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1.8s ease-in-out; pointer-events:none; }
  #roomVid.on { opacity:1; }
  #roomIdle { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .6s ease; pointer-events:none; }
  #roomIdle.on { opacity:1; }
  /* Look-around panorama: no extra zoom or drift, so the image stays as sharp as possible */
  .bg.wide { inset:0; animation:none; transform:none; }
  /* ---------- Button frame: carved gold-and-red plaque (assets/btn-frame.svg) on every button ---------- */
  .btn, .btn:hover, .btn:active, #go, #go:hover, #go:active, #enterBtn, #enterBtn:hover, #enterBtn:active {
    background:url('assets/btn-frame.svg') center / 100% 100% no-repeat !important; border:none !important; border-radius:0 !important;
    box-shadow:none !important; filter:drop-shadow(0 6px 12px rgba(0,0,0,.55)); -webkit-backdrop-filter:none !important; backdrop-filter:none !important;
    aspect-ratio:1600 / 280; display:flex !important; align-items:center; justify-content:center; padding:2px 15% 0 !important; white-space:nowrap; min-width:240px;
    color:#f8e7bf !important; font:700 clamp(14px,3.8vw,17px)/1.5 'Battambang',serif !important; text-shadow:0 1px 3px rgba(0,0,0,.85) !important; text-align:center; }
  .btn::before, #go::before { display:none !important; }
  .btn:hover { filter:drop-shadow(0 6px 12px rgba(0,0,0,.55)) brightness(1.08); }
  .btn:active { transform:scale(.97); filter:drop-shadow(0 4px 8px rgba(0,0,0,.55)) brightness(1.15); }
  #choices, #form .q { gap:8px !important; }
  #line.low.haschoices { bottom:calc(9% + 2 * (min(100vw, 100vh * 9 / 16) * .84 * 280 / 1600) + 30px); }   /* sit above the two framed choice buttons */
  /* ---------- Name / date fields: no box, just a gold underline; the hint types itself out like a typewriter ---------- */
  #form input, #form input:focus { background:transparent !important; border:none !important; border-bottom:1.5px solid rgba(233,196,106,.75) !important; border-radius:0 !important;
    box-shadow:none !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important; padding:10px 4px !important; text-align:center;
    font:500 clamp(18px,5vw,22px) 'Kantumruy Pro',sans-serif !important; color:#f8e7bf !important; caret-color:var(--gold); }

  #form input::placeholder { color:rgba(248,231,191,.55); }
  #form input::-webkit-datetime-edit { padding:0; }
  #form input::-webkit-calendar-picker-indicator { filter:invert(.8) sepia(1) saturate(3) hue-rotate(5deg); opacity:.8; }
  /* comic pages */
  #comic { position:absolute; inset:0; z-index:6; background:#000; opacity:0; visibility:hidden; transition:opacity .5s ease, visibility 0s .5s; cursor:pointer; }

  #comic .hint { position:absolute; left:0; right:0; bottom:1.2%; text-align:center; font:12px 'Kantumruy Pro'; color:rgba(255,255,255,.6); text-shadow:0 1px 4px #000; opacity:0; transition:opacity .4s .9s; }
  #comic.shown .hint { opacity:1; animation:pulse 2s 1.3s infinite; }
  /* ---------- Landing: the character, then the whole comic to scroll through, then the button ---------- */
  #tap { display:block !important; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:0 !important; background:none !important; cursor:default; scroll-behavior:smooth; }
  #tap .hero { position:relative; height:100%; display:flex; flex-direction:column; justify-content:space-between; padding:calc(22px + env(safe-area-inset-top)) 8% 6%;
    background:linear-gradient(rgba(20,4,4,.7), rgba(20,4,4,0) 24%, rgba(20,4,4,0) 50%, rgba(20,4,4,.85) 82%, #050202); }
  #tap .scrollhint { font:13px 'Kantumruy Pro'; color:rgba(246,234,210,.75); text-align:center; }

  @keyframes bob { 50% { transform:translateY(6px); } }
  #tap .page { display:block; width:100%; height:auto; background:#000; }
  #tap .end { padding:46px 8% calc(50px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:16px; text-align:center; background:linear-gradient(#050202, #2a0808); }
  #tap .end p { font:clamp(20px,5.4vw,26px)/1.7 'Battambang',serif; color:var(--text); }
  #tap .end small { font:12px 'Kantumruy Pro'; color:rgba(246,234,210,.6); }
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
  #incense video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .6s ease, filter 3.6s ease; }
  #incense.waking video { filter:blur(4px) brightness(.9); transition:opacity .6s ease, filter .4s ease; }
  #incense.drowsy video { filter:blur(10px) brightness(.8); transition:opacity .6s ease, filter 2s ease-in; }
  #incense video.on { opacity:1; }
  #incense #incTitle { z-index:2; }
  #incBtn { position:absolute; left:50%; bottom:9%; transform:translateX(-50%); z-index:2; width:min(86%,340px); transition:opacity .5s; }
  #incBtn.gone { display:none !important; }
  /* Praying: eyelids close from top and bottom into black, then open again */
  #incEyes { position:absolute; inset:0; z-index:1; pointer-events:none; background:rgba(20,4,2,0); transition:background 2.8s ease; }
  #incEyes.shut { background:rgba(20,4,2,.55); transition:background 2s ease-in .6s; }   /* a little warm light still comes through closed eyelids */
  #incEyes::before, #incEyes::after { content:''; position:absolute; left:0; right:0; height:62%; transition:transform 3s cubic-bezier(.4,0,.3,1); }
  #incEyes.shut::before, #incEyes.shut::after { transition-duration:2s; transition-timing-function:cubic-bezier(.45,0,.25,1); }
  #incEyes::before { top:0; transform:translateY(-100%); background:linear-gradient(#0d0403 0 55%, rgba(13,4,3,.85) 72%, rgba(13,4,3,0)); }
  #incEyes::after { bottom:0; transform:translateY(100%); background:linear-gradient(0deg, #0d0403 0 55%, rgba(13,4,3,.85) 72%, rgba(13,4,3,0)); }
  #incEyes.shut::before, #incEyes.shut::after { transform:translateY(0); }
  #incense.slowout { transition:opacity 1.2s ease-in-out, visibility 0s 1.2s; }
  #incense.slowout ~ #fateVid, #fateVid.on { transition:opacity 1s ease-in-out; }
  /* Reading text inside the same gold ornament frame as the card */
  #reading .rframe { position:relative; margin:22px 0 6px; padding:30px 26px 26px; border:2.5px solid #F6C686; border-radius:12px; background:linear-gradient(180deg, rgba(92,20,18,.55), rgba(40,8,8,.75));
    background-image:url('assets/frame/tl.svg'), url('assets/frame/tr.svg'), url('assets/frame/bl.svg'), url('assets/frame/br.svg'), linear-gradient(180deg, rgba(92,20,18,.55), rgba(40,8,8,.75));
    background-position:3px 3px, calc(100% - 3px) 3px, 3px calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), 0 0; background-size:34px 34px, 34px 34px, 34px 34px, 34px 34px, 100% 100%; background-repeat:no-repeat; }
  #reading .rframe::before { content:''; position:absolute; inset:7px; border:1px solid rgba(246,198,134,.55); border-radius:7px; pointer-events:none; }
  #reading .rframe > p:first-child { margin-top:0; }
  #reading .divider { display:block; width:48%; max-width:190px; margin:4px auto 10px; }
  /* Gold divider under each question */
  #form h4::after { content:''; display:block; width:34%; max-width:130px; aspect-ratio:9 / 1; margin:8px 0 2px; background:url('assets/divider.png') left center / contain no-repeat; }
  /* Keep the browser's autofill from painting a grey box or changing the font */
  #form input:-webkit-autofill, #form input:-webkit-autofill:hover, #form input:-webkit-autofill:focus {
    -webkit-text-fill-color:#f8e7bf !important; -webkit-box-shadow:0 0 0 1000px transparent inset !important; transition:background-color 99999s ease 0s; caret-color:var(--gold); }
  #form input { text-transform:none !important; }
  #dobHint { min-height:1.6em; margin-top:-2px; text-align:center; font:14px/1.6 'Battambang',serif; color:rgba(248,231,191,.75); }
  #nameHint { min-height:1.6em; margin-top:-2px; text-align:center; font:14px/1.6 'Battambang',serif; color:#ffb08a; }
  #nameHint.bad::before, #dobHint.bad::before { content:'លោកគ្រូ៖ '; display:block; font-size:11px; letter-spacing:.05em; color:rgba(233,196,106,.75); }
  #nameHint.bad, #dobHint.bad { color:#f3c9a0; text-shadow:0 0 10px rgba(255,140,60,.35); }
  #nameHint.shake { animation:dobShake .45s ease; }
  #dobHint.bad { color:#ffb08a; font-style:normal; }
  #dobHint.shake { animation:dobShake .45s ease; }
  @keyframes dobShake { 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }
  #dobHint.ok { color:var(--gold); }
  #form #dob { letter-spacing:.06em; font-family:'Battambang',serif !important; }
  /* Animated light on the card's gold ring (the card itself is a flat image) */
  #cardWrap { position:relative; margin:28px auto 6px; }
  #cardWrap #cardImg { margin:0 auto; }
  #cardWrap .ringFx { position:absolute; left:50%; top:32.6%; width:47.2%; aspect-ratio:1; transform:translate(-50%,-50%); pointer-events:none; overflow:visible; }
  .ringFx .halo { filter:drop-shadow(0 0 3px rgba(255,200,90,.55)); animation:ringGlow 4s ease-in-out infinite; }
  @keyframes ringGlow { 50% { filter:drop-shadow(0 0 9px rgba(255,210,110,.9)); } }
  @media (prefers-reduced-motion: reduce) { .ringFx .halo, .ringFx .inner, .ringFx .points2 { animation:none; } }
  .rlogo { width:1.7em; height:1.7em; vertical-align:middle; margin-right:.3em; filter:drop-shadow(0 2px 6px rgba(0,0,0,.6)); }
  .brand { display:flex; align-items:center; justify-content:center; }
  #siteBar span { display:inline-flex; align-items:center; }
  /* empty + focused: hide the hint so the centred cursor never sits on top of it */
  #form input::placeholder { transition:opacity .25s ease; }
  #form input:focus::placeholder { opacity:0; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg fallback-hall" id="bgHall"></div>
  <div class="bg fallback-altar" id="bgAltar"></div>
  <video id="roomVid" src="assets/room-dark.mp4" playsinline preload="auto"></video>

<script>
/* ---------- Optional art: drop files in ./assets and they replace the painted fallbacks ---------- */
const ART = { hall:'assets/room-pano.jpg', altar:'assets/room.jpg', achar:'assets/monk.png' };
function tryImage(src, ok){ const i=new Image(); i.onload=()=>ok(src, i.naturalWidth/i.naturalHeight); i.src=src; }
function setBg(el, fallback){ return (s, ratio)=>{ el.classList.remove(fallback); el.style.backgroundImage=`url(${s})`; el.classList.toggle('wide', ratio>0.75); look.update(); }; }  // wider than ~3:4 → swipe to look around
tryImage(ART.hall,  setBg($('#bgHall'),  'fallback-hall'));
tryImage(ART.altar, setBg($('#bgAltar'), 'fallback-altar'));
tryImage(ART.achar, s=>{ $('#char').innerHTML=`<img src="${s}" alt="">`; });

function $(q){ return document.querySelector(q); }

/* ---------- Story script ---------- */
/* A choice's `lines` are inserted right after the current beat, so each path gets its own scenes. */
const A = (text, extra={}) => ({ bg:'altar', char:true, who:'លោកគ្រូ', low:true, text, ...extra });
const STORY = [
  { bg:'hall', text:'' },   // the walk-in video plays with no text; the comic pages before it tell the story
  A('អ្នកដែលពិតជាចង់ដឹង… តែងតែមកយឺតបែបនេះ។'),
  A('អ្នកយល់សប្តិឃើញទៀនមួយ។ កុំភ្ញាក់ផ្អើលអី — នោះហើយជាមូលហេតុដែលមនុស្សគ្រប់គ្នាមកទីនេះ។', { choices:[
    { label:'«តើលោកដឹងដោយរបៀបណា?»', lines:[
      A('ទៀនដែលអ្នកយល់សប្តិឃើញ ត្រូវបានអុជនៅទីនេះ។ អ្នកណាដែលវាហៅមក ខ្ញុំបានជួបទាំងអស់។'),

['1','2','3','4','5','6'].forEach(n=>{ const i=new Image(); i.src='assets/comic/page'+n+'.jpg'; });   // preload so pages appear instantly
function showComic(pages, done){
  const C=$('#comic'), img=C.querySelector('img'); let k=0, ready=false;
  const turn=()=>{
    if(k>=pages.length){ C.classList.remove('on'); C.onclick=null; setTimeout(done, 450); return; }
    ready=false; C.classList.remove('shown');
    setTimeout(()=>{ img.src='assets/comic/page'+pages[k]+'.jpg'; k++; void img.offsetWidth; C.classList.add('shown'); setTimeout(()=>ready=true, 900); }, C.classList.contains('on')?350:0);
  };
  C.classList.add('on'); C.onclick=e=>{ e.stopPropagation(); if(ready) turn(); };
  turn();
}

/* ---------- Engine ---------- */
let step=-1, busy=false, started=false;
const line=$('#line'), hint=$('#hint'), choices=$('#choices'), form=$('#form');

let gen=0;
const charVid=$('#charVid'), writeVid=$('#writeVid'); let charVidOK=false;
function charVidReady(){
  if(charVidOK) return; charVidOK=true;
  if(!started){ charVid.classList.add('on'); charVid.play().catch(()=>{}); return; }   // landing screen: he is already there, looking at you
  // if the clip finishes loading while his scene is already on screen, bring him in now
  if(started && step>=0 && STORY[step].char && !ex.on && !$('#incense').classList.contains('on')){ charVid.classList.add('on'); charVid.play().catch(()=>{}); $('#char').classList.remove('on'); look.update(); }
}
charVid.addEventListener('loadeddata', charVidReady); charVid.addEventListener('canplay', charVidReady);
if(charVid.readyState>=2) charVidReady();
charVid.addEventListener('error', ()=>{ charVidOK=false; });
const CHAR_LOOP_START=0;   // when the video ends, start again from the beginning   // the candles-light reveal plays once (0–3.5 s), then the rest loops   // seconds: the first 1.4s (he raises the beads) play once, the rest loops
charVid.addEventListener('ended', ()=>{ if(CHAR_LOOP_START===null) return; charVid.currentTime=CHAR_LOOP_START; if(charVid.classList.contains('on')) charVid.play().catch(()=>{}); });
function show(i){
  step=i; const s=STORY[i]; busy=true; const my=++gen;   // `gen` cancels timers from a previous beat (e.g. after Skip)
  $('#bgHall').classList.toggle('on', s.bg==='hall');
  $('#bgAltar').classList.toggle('on', s.bg==='altar');
  const roomV=$('#roomVid'), useRoom=s.bg==='hall' && !s.char && roomV.readyState>=2;   // opening lines: play the walk-in once, never restart it
  if(useRoom && !roomV.classList.contains('on') && !roomV.classList.contains('done')){ roomV.classList.add('on'); if(!roomV.dataset.played){ roomV.dataset.played='1'; roomV.currentTime=0; roomV.play().catch(()=>{}); } }
  if(!useRoom){ roomV.classList.remove('on'); $('#roomIdle').classList.remove('on'); $('#roomIdle').pause(); sfx.stopEnter(); }
  if(s.explore){ if(!ex.ok) return show(i+1); return startExplore(); }
  stopExplore();
  if(!s.form){ form.classList.remove('on'); $('#stage').classList.remove('asking'); }   // leaving the questions closes them
  const useWrite=!!s.char && s.vid==='write' && writeVid.readyState>=2;   // beats marked vid:'write' use the writing clip
  writeVid.classList.toggle('on', useWrite); if(useWrite) writeVid.play().catch(()=>{}); else writeVid.pause();
  const useVid=!!s.char && charVidOK && !useWrite;          // character scenes: full-screen looping video if it loaded, else the still image
  charVid.classList.toggle('on', useVid);
  if(useVid) charVid.play().catch(()=>{}); else charVid.pause();
  $('#char').classList.toggle('on', !!s.char && !charVidOK);
  look.update();
  line.classList.remove('on'); hint.classList.remove('on'); choices.innerHTML='';
  setTimeout(()=>{
    if(my!==gen) return;
    line.innerHTML=(s.who?`<span class="who">${s.who}</span>`:'')+s.text;
    line.classList.toggle('low', !!s.low && !s.form);
    line.classList.toggle('top', !!s.form);
    line.classList.toggle('box', !s.who);
    line.classList.toggle('haschoices', !!s.choices);
    if(!s.form && s.text) line.classList.add('on'); sfx.chime(s.char?0.5:0.25);
    setTimeout(()=>{
      if(my!==gen) return;
      busy=false;
      if(s.choices) s.choices.forEach(c=>{ const b=document.createElement('button'); b.className='btn'; b.textContent=c.label; b.onclick=e=>{e.stopPropagation(); s.choices=null; STORY.splice(step+1,0,...(c.lines||[])); next();}; choices.appendChild(b); });
      else if(s.form) openForm();
      else if(s.text) hint.classList.add('on');
    }, 1100);
  }, step===0?200:700);
}
function next(){
  const rv=$('#roomVid');   // don't leave the room while the walk-in is still playing; the fortune teller comes when the lights go out
  if(rv.classList.contains('on') && !rv.ended && STORY[step+1] && STORY[step+1].char) return;
  const nx=STORY[step+1];
  if(nx && nx.form && !next.page6){ next.page6=true; showComic([6], ()=>show(step+1)); return; }   // comic page 6 ("sit, tell me when you were born") before the questions
  if(step<STORY.length-1) show(step+1);
}

/* ---------- Explore: tap the floor to walk, tap a light to look at it ----------
   All positions are fractions of the wide altar image (x: 0 left → 1 right, y: 0 top → 1 bottom). */
const SPOTS = [
  { x:.075,y:.24, sx:.11, sy:.80, text:'ក្រណាត់យ័ន្តចាស់មួយព្យួរលើជញ្ជាំង។ អក្សរលើវា ហាក់ដូចជាកំពុងកម្រើក។' },
  { x:.185,y:.69, sx:.20, sy:.78, text:'ទៀនទាំងនេះឆេះ តែមិនរលាយទេ។ តើនរណាអុជវា?' },
  { x:.81, y:.52, sx:.80, sy:.79, text:'ខាងក្រៅបង្អួច ភ្លៀងចាប់ផ្តើមធ្លាក់ម្តងទៀត។ ខាងក្នុងនេះ ស្ងាត់ជ្រងំ។' },
  { x:.93, y:.27, sx:.89, sy:.80, text:'គំនូរចាស់មួយ៖ ផ្ទះមួយដូចផ្ទះនេះ។ នៅមាត់ទ្វារ មានមនុស្សម្នាក់ឈរ… មើលទៅដូចអ្នក។' },
  { x:.50, y:.50, sx:.50, sy:.715, end:true, text:'អ្នកអង្គុយចុះនៅមុខតុរបស់លោកគ្រូ។' },
];
const HORIZON=.50, NEAR=.95;
const minY = x => (x>.44 && x<.56) ? .705 : .765;          // only the center aisle reaches the altar; elsewhere stay in front of the pillars
const world=$('#world'), player=$('#player'), exHint=$('#exHint');
const ex = { ok:false, on:false, ratio:16/9, x:.5, y:.93, tx:.5, ty:.93, cam:null, target:null, walking:false, raf:0, last:0 };
$('#worldImg').addEventListener('load', e=>{ ex.ratio=e.target.naturalWidth/e.target.naturalHeight; ex.ok=ex.ratio>1.2; });
tryImage('assets/player.png', s=>{ player.classList.remove('lantern'); player.innerHTML=`<img src="${s}" alt="">`; });
player.classList.add('lantern'); player.innerHTML='<div class="orb"></div>';   // shown until assets/player.png exists
SPOTS.forEach(sp=>{ const d=document.createElement('div'); d.className='spot'; d.style.left=sp.x*100+'%'; d.style.top=sp.y*100+'%'; sp.el=d; world.appendChild(d); });

function exRender(t, dt){
  const H=stage.offsetHeight, Wv=stage.offsetWidth, Ww=H*ex.ratio;
  world.style.width=Ww+'px';
  const bob = ex.walking ? Math.sin(t/90)*0.35 : 0;
  player.style.left=ex.x*100+'%'; player.style.top=(ex.y*100+bob*(ex.y-HORIZON))+'%';
  player.style.height=(0.6*(ex.y-HORIZON)*100)+'%';                      // perspective: smaller when further from the camera
  const want=Math.max(0, Math.min(Ww-Wv, ex.x*Ww - Wv/2));               // camera follows the walker
  ex.cam = ex.cam===null ? want : ex.cam+(want-ex.cam)*Math.min(1, dt*4);
  world.style.transform=`translateX(${-ex.cam}px)`;
}
function exTick(t){
  if(!ex.on) return;
  const dt=Math.min(.05, (t-ex.last)/1000); ex.last=t;
  const dx=(ex.tx-ex.x)*ex.ratio, dy=ex.ty-ex.y, dist=Math.hypot(dx,dy);
  if(dist>.003){ const d=Math.min(dist, (0.75*(ex.y-HORIZON)+.06)*dt); ex.x+=dx/dist*d/ex.ratio; ex.y+=dy/dist*d; ex.walking=true; }
  else if(ex.walking){ ex.walking=false; exArrive(); }
  exRender(t, dt);
  ex.raf=requestAnimationFrame(exTick);
}
function exArrive(){
  const sp=ex.target; if(!sp) return; ex.target=null;
  sp.el.classList.add('seen');
  line.innerHTML=sp.text; line.classList.remove('top','low','haschoices'); line.classList.add('box','on'); sfx.chime(sp.end?0.6:0.3);
  if(sp.end){ const my=gen; exHint.classList.remove('on'); setTimeout(()=>{ if(ex.on) closeExplore(); }, 2600); }
}
function startExplore(){
  busy=false; ex.on=true; ex.target=null; ex.cam=null; ex.walking=false;
  charVid.classList.remove('on'); charVid.pause(); $('#char').classList.remove('on');
  line.classList.remove('on'); hint.classList.remove('on'); choices.innerHTML=''; look.update();
  world.classList.add('on'); exHint.classList.add('on');
  ex.last=performance.now(); cancelAnimationFrame(ex.raf); ex.raf=requestAnimationFrame(exTick);
}
function openExplore(){ if(!ex.ok) return; $('#reading').classList.remove('on'); $('#exBack').classList.add('on'); startExplore(); }
function closeExplore(){
  stopExplore(); $('#exBack').classList.remove('on'); line.classList.remove('on');
  if(charVidOK){ charVid.classList.add('on'); charVid.play().catch(()=>{}); }
  $('#reading').classList.add('on');
}
function stopExplore(){ if(!ex.on) return; ex.on=false; cancelAnimationFrame(ex.raf); world.classList.remove('on'); exHint.classList.remove('on'); }
world.addEventListener('click', e=>{
  e.stopPropagation(); if(!ex.on) return;
  const r=world.getBoundingClientRect(), sp=SPOTS.find(s=>s.el===e.target);
  line.classList.remove('on');
  if(sp){ ex.target=sp; ex.tx=sp.sx; ex.ty=sp.sy; }
  else { ex.target=null; ex.tx=Math.max(.03, Math.min(.97, (e.clientX-r.left)/r.width)); ex.ty=Math.max(minY(ex.tx), Math.min(NEAR, (e.clientY-r.top)/r.height)); }
  if(Math.hypot((ex.tx-ex.x)*ex.ratio, ex.ty-ex.y)<=.003){ ex.walking=false; exArrive(); }   // already standing there
});

$('#exBack').onclick=e=>{ e.stopPropagation(); closeExplore(); };

/* ---------- Look around: drag / swipe left-right across wide background images ---------- */
const look = {
  x:{ bgHall:50, bgAltar:50 },   // background-position X (%) per layer; 50 = centered
  dragging:false, moved:false, startX:0, startPos:50, vel:0, lastX:0, lastT:0, raf:0,
  active(){ return ['bgHall','bgAltar'].find(id=>$('#'+id).classList.contains('on')); },
  wide(id){ return id && $('#'+id).classList.contains('wide') && !$('#roomVid').classList.contains('on') && !$('#charVid').classList.contains('on') && !$('#writeVid').classList.contains('on') && !$('#fateVid').classList.contains('on') && !ex.on; },
  apply(id){ $('#'+id).style.backgroundPosition=`${this.x[id]}% center`; },
  update(){ const id=this.active(); $('#lookHint').classList.toggle('on', started && this.wide(id) && !this.used); },
  // turning the phone left/right turns the view (compass heading); dragging still works and takes over while touching
  gyroOn:false, a0:null, x0:50,
  askGyro(){ try{ if(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==='function') DeviceOrientationEvent.requestPermission().catch(()=>{}); }catch(e){} },
  startGyro(){
    if(this.gyroOn) return; this.gyroOn=true;
    addEventListener('deviceorientation', e=>{
      const id=this.active(); if(e.alpha==null || !this.wide(id) || this.dragging) { this.a0=null; return; }
      if(this.a0===null){ this.a0=e.alpha; this.x0=this.x[id]; return; }
      let d=e.alpha-this.a0; if(d>180) d-=360; if(d<-180) d+=360;            // degrees turned since we started following
      this.x[id]=Math.max(0, Math.min(100, this.x0 - d*0.9));                  // about 110° of turning covers the whole room
      this.apply(id); if(Math.abs(d)>4 && !this.used){ this.used=true; this.update(); }
    });
  },
};
const stage=$('#stage');
stage.addEventListener('pointerdown', e=>{
  const id=look.active(); if(!look.wide(id) || e.target.closest('button,input,#reading')) return;
  cancelAnimationFrame(look.raf);
  Object.assign(look,{ dragging:true, moved:false, startX:e.clientX, startPos:look.x[id], lastX:e.clientX, lastT:performance.now(), vel:0 });
});
addEventListener('pointermove', e=>{
  if(!look.dragging) return;
  const id=look.active(), dx=e.clientX-look.startX;
  if(Math.abs(dx)>8) look.moved=true;
  if(!look.moved) return;
  // dragging right reveals the left side (like turning your head)
  look.x[id]=Math.max(0, Math.min(100, look.startPos - dx/stage.offsetWidth*70));
  look.apply(id);
  const t=performance.now(); look.vel=(e.clientX-look.lastX)/Math.max(1,t-look.lastT); look.lastX=e.clientX; look.lastT=t;
});
addEventListener('pointerup', ()=>{
  if(!look.dragging) return; look.dragging=false;
  if(!look.moved) return;
  look.used=true; look.update();
  const id=look.active();   // glide a little after release
  (function glide(){ look.vel*=0.92; if(Math.abs(look.vel)<0.01) return;
    look.x[id]=Math.max(0, Math.min(100, look.x[id] - look.vel*16/stage.offsetWidth*70)); look.apply(id);
    look.raf=requestAnimationFrame(glide); })();
});

$('#stage').addEventListener('click', e=>{
  if(look.moved){ look.moved=false; return; }   // a drag is not a tap
  if(!started || busy || ex.on) return;
  const s=STORY[step]; if(s.choices||s.form||e.target.closest('#reading')) return;
  next();
});
function begin(){ look.askGyro(); started=true; $('#tap').remove(); charVid.pause(); charVid.classList.remove('on'); charVid.currentTime=0; sfx.start(); }
$('#enterBtn').onclick=e=>{ e.stopPropagation(); begin(); next.page6=true; show($('#roomVid').readyState>=2 ? 0 : STORY.findIndex(s=>s.form)); };   // walk into the room first, then the questions   // after the comic: straight to "when were you born?"

$('#go').onclick=e=>{
  e.stopPropagation();
  const v=dobValue(); if(!v){ dobCheck(true); $('#dob').focus(); return; }
  startIncense(()=>{ showReading(v); openSite(); });   // light the incense first, then the reading and the Reasey scene
};


/* ---------- Birth date: typed in Khmer style (ថ្ងៃ/ខែ/ឆ្នាំ), Khmer or Latin digits, auto-corrected ---------- */
const KH_DIG='០១២៣៤៥៦៧៨៩', KH_MONTH=['មករា','កុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា','កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];
const toKh=t=>String(t).replace(/[0-9]/g,d=>KH_DIG[d]), toLat=t=>String(t).replace(/[០-៩]/g,d=>KH_DIG.indexOf(d));
function dobParts(){   // read whatever was typed: 15041995, 15/4/1995, ១៥ ៤ ១៩៩៥, 15-04-95 …
  const raw=toLat($('#dob').value), groups=raw.split(/[^0-9]+/).filter(Boolean);
  let d,m,y;
  if(groups.length>=3){ [d,m,y]=groups; }
  else { const n=raw.replace(/\D/g,''); d=n.slice(0,2); m=n.slice(2,4); y=n.slice(4,8); }
  d=+d; m=+m; y=+y;
  if(y && y<100) y += (y > (new Date().getFullYear()%100) ? 1900 : 2000);   // 95 → 1995, 08 → 2008
  return {d,m,y};
}
function dobValue(){
  const {d,m,y}=dobParts(), now=new Date();
  if(!(y>=1900 && y<=now.getFullYear() && m>=1 && m<=12 && d>=1)) return '';
  const dt=new Date(y,m-1,d); if(dt.getMonth()!==m-1 || dt>now) return '';   // no 31 កុម្ភៈ, no future dates
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function dobScold(){   // the fortune teller points out exactly what is wrong, a little sharply, so the player looks again
  const {d,m,y}=dobParts(), now=new Date(), typed=toLat($('#dob').value).replace(/\D/g,'');
  if(typed.length<6) return '«ថ្ងៃ ខែ ឆ្នាំ ត្រូវតែគ្រប់ទាំងបី ទើបផ្កាយតម្រៀបជួរបាន… ឧ. ១៥/០៤/១៩៩៥»';
  if(m<1||m>12) return `«ខែទី${toKh(m)}? មេឃមានតែ ១២ ខែប៉ុណ្ណោះ… កុំលេងសើចជាមួយវាសនា។»`;
  const last=new Date(y||2000, m, 0).getDate();
  if(d<1||d>last) return `«ខែ${KH_MONTH[m-1]} គ្មានថ្ងៃទី${toKh(d)} ឡើយ… ព្រះចន្ទមិនដែលរះនៅថ្ងៃនោះទេ។»`;
  if(y>now.getFullYear() || new Date(y,m-1,d)>now) return '«ថ្ងៃនោះមិនទាន់មកដល់ផង… គ្មាននរណាកើតមុនទៀនរបស់ខ្លួនឆេះទេ។»';
  if(y<1900) return `«ឆ្នាំ${toKh(y)}? នោះជាសម័យដូនតាអ្នកទៅហើយ… សូមប្រាប់ឆ្នាំកំណើតពិត។»`;
  return '«ទៀនញ័រ… ថ្ងៃនេះមិនត្រឹមត្រូវទេ។ វាសនាមិនអាចអានពីថ្ងៃខុសបានឡើយ។»';
}
function dobCheck(force){
  const h=$('#dobHint'), v=dobValue(), typed=toLat($('#dob').value).replace(/\D/g,'');
  if(v){ const [y,m,d]=v.split('-').map(Number); h.textContent=`ថ្ងៃទី${toKh(d)} ខែ${KH_MONTH[m-1]} ឆ្នាំ${toKh(y)}`; h.className='ok'; }
  else if(force || typed.length>=8){ h.textContent=dobScold(); h.className='bad'; h.classList.remove('shake'); void h.offsetWidth; h.classList.add('shake'); }
  else { h.textContent=''; h.className=''; }
}
$('#dob').addEventListener('input', e=>{   // auto-format as they type: Khmer digits and slashes
  const el=e.target; if(e.isComposing) return; if(e.inputType && e.inputType.startsWith('delete')) { dobCheck(); return; }
  const raw=toLat(el.value), parts=raw.split(/[^0-9]+/);   // a separator after one digit means "pad it": 4/ → 04/
  const n=parts.map((g,i)=> i<parts.length-1 && i<2 && g.length===1 ? '0'+g : g).join('').slice(0,8);
  let out=n.slice(0,2); if(n.length>2) out+='/'+n.slice(2,4); if(n.length>4) out+='/'+n.slice(4);
  if(n.length===2||n.length===4) out+='/';
  el.value=toKh(out); dobCheck();
});
$('#dob').addEventListener('compositionend', e=>e.target.dispatchEvent(new Event('input')));
$('#dob').addEventListener('blur', ()=>{   // tidy up on leave: pad and fix two-digit years
  const v=dobValue(); if(v){ const [y,m,d]=v.split('-'); $('#dob').value=toKh(`${d}/${m}/${y}`); } dobCheck();
});
$('#dob').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); $('#go').click(); } });
/* ---------- Questions, one per screen: whose fate → name → birth date ---------- */
const WHO={ self:'', partner:'គូស្នេហ៍', family:'គ្រួសារ', friend:'មិត្តភក្តិ' }; let who='self';
const qs=[...document.querySelectorAll('#form .q')];
function typeHint(el, text){   // types the placeholder out one Khmer letter at a time, with a blinking bar at the end
  clearInterval(el._tw); const g=[...new Intl.Segmenter('km',{granularity:'grapheme'}).segment(text)].map(x=>x.segment); let k=0, on=true;
  el._tw=setInterval(()=>{ if(el.value){ el.placeholder=text; clearInterval(el._tw); return; }
    if(k<g.length){ k++; el.placeholder=g.slice(0,k).join('')+'▏'; } else { on=!on; el.placeholder=text+(on?'▏':' '); } }, 90);
}
function stopHint(el){ clearInterval(el._tw); el._tw=null; const t=el.dataset.hint; if(t) el.placeholder=t; }   // never touch the field while someone types (Khmer keyboards compose letters)
['focus','compositionstart','keydown','input','pointerdown'].forEach(ev=>document.getElementById('name').addEventListener(ev, e=>stopHint(e.target)));
function showQ(i){ qs.forEach((q,k)=>q.classList.toggle('on', k===i)); if(i===1){ const n=$('#name'); typeHint(n, n.dataset.hint||n.placeholder.replace('▏','')); setTimeout(()=>stopHint(n), 1600); } }   // hint stays visible until the player taps the field

function nameScold(v){   // the fortune teller notices a missing or odd name
  if(!v) return '«វិញ្ញាណមិនស្គាល់មនុស្សគ្មានឈ្មោះទេ… ប្រាប់ឈ្មោះអ្នកមក ទើបខ្ញុំហៅវាសនាអ្នកបាន។»';
  if(/^[0-9០-៩\s]+$/.test(v)) return '«លេខមិនមែនជាឈ្មោះទេ… ផ្កាយហៅអ្នកដោយឈ្មោះ មិនមែនដោយលេខឡើយ។»';
  if(!/[\p{L}]/u.test(v)) return '«ទៀនញ័រ ពេលខ្ញុំអានឈ្មោះនេះ… សូមសរសេរឈ្មោះពិតរបស់អ្នក។»';
  if([...new Intl.Segmenter('km',{granularity:'grapheme'}).segment(v)].length<2) return '«ឈ្មោះខ្លីពេក វាសនាលាក់ខ្លួន… សូមប្រាប់ឈ្មោះពេញរបស់អ្នក។»';
  return '';
}

/* ---------- Incense offering: waiting loop + អុជធូប button, then the lighting clip ---------- */
function startIncense(done){
  const box=$('#incense'), title=$('#incTitle'), wait=$('#incWait'), light=$('#incLight'), btn=$('#incBtn');
  writeVid.classList.remove('on'); writeVid.pause();
  form.classList.remove('on'); $('#stage').classList.remove('asking'); line.classList.remove('on'); hint.classList.remove('on');
  charVid.classList.remove('on'); charVid.pause(); $('#char').classList.remove('on');
  title.textContent='សូមអុជធូបបីសរសៃ មុននឹងមើលវាសនា'; btn.classList.remove('gone'); $('#incEyes').classList.remove('shut'); box.classList.remove('drowsy','waking');
  light.classList.remove('on'); $('#incPlant').classList.remove('on'); wait.currentTime=0; wait.classList.add('on'); wait.play().catch(()=>{});
  box.classList.add('on');
  let gone=false; const finish=()=>{ if(gone) return; gone=true; box.classList.add('slowout'); box.classList.remove('on');   // slow dissolve from the urn into his fate video
    setTimeout(()=>{ wait.pause(); light.pause(); $('#incPlant').pause(); $('#incPlant').classList.remove('on'); box.classList.remove('slowout'); },1500); playFate(done); };
  const plant=()=>{   // after the prayer: the hands place the sticks in the urn
    const pl=$('#incPlant'); title.textContent='';
    if(pl.readyState<2) return setTimeout(finish,600);
    pl.currentTime=0; pl.classList.add('on'); pl.play().catch(()=>setTimeout(finish,600)); setTimeout(()=>light.classList.remove('on'),600);
    pl.ontimeupdate=()=>{ if(pl.duration && pl.currentTime>=pl.duration-1.2) finish(); };   // start the dissolve while the last second still plays
    pl.onended=finish; setTimeout(finish, 14000);
  };
  btn.textContent='អុជធូប';
  btn.onclick=e=>{
    e.stopPropagation(); btn.blur(); btn.classList.add('gone');
    title.textContent='ធូបបីសរសៃ ឧទ្ទិសដល់ដូនតា និងអ្នកថែរក្សា…';
    if(light.readyState<2) return setTimeout(finish, 2400);   // lighting clip missing
    light.currentTime=0; light.classList.add('on'); wait.classList.remove('on');
    light.onended=()=>{   // hands held in prayer: eyes close to black, wait until the player has prayed
      title.textContent=''; $('#incEyes').classList.add('shut'); box.classList.add('drowsy');   // vision blurs as the eyes close
      setTimeout(()=>{ title.textContent='សូមអធិស្ឋានក្នុងចិត្ត…'; btn.textContent='អធិស្ឋានរួចហើយ'; btn.classList.remove('gone'); }, 2200);
      btn.onclick=e2=>{ e2.stopPropagation(); btn.blur(); btn.classList.add('gone'); title.textContent='';
        plant(); setTimeout(()=>$('#incEyes').classList.remove('shut'), 250); box.classList.replace('drowsy','waking'); setTimeout(()=>box.classList.remove('waking'), 1200); };   // eyes open blurry, then focus   // eyes open on the hands placing the sticks
    };
    light.play().catch(()=>light.onended());
  };
}
/* After the incense: he closes his eyes, the tattoo glows, he opens his eyes — then the reading */
function playFate(done){
  const v=$('#fateVid');
  let finished=false; const end=()=>{ if(finished) return; finished=true; line.classList.remove('on'); done(); };
  const go=()=>{
    v.currentTime=0; v.classList.add('on');
    v.onended=()=>{ line.classList.remove('on'); setTimeout(end, 500); };   // brief hold on his gold and red eyes before the reading
    v.play().catch(end);
    line.innerHTML='លោកគ្រូបិទភ្នែកអធិស្ឋាន… ពេលគាត់បើកភ្នែក វាសនារបស់អ្នកបានបង្ហាញ។';
    line.classList.remove('top','low','haschoices'); line.classList.add('box','on');
    setTimeout(end, 14000);   // safety: never leave the player waiting if the clip stalls
  };
  if(v.readyState>=2) return go();
  v.load(); let started=false; const ready=()=>{ if(started) return; started=true; go(); };   // still loading: wait for it instead of skipping
  v.addEventListener('loadeddata', ready, {once:true});
  setTimeout(()=>{ if(!started){ started=true; if(charVidOK){ charVid.classList.add('on'); charVid.play().catch(()=>{}); } end(); } }, 5000);
}

/* ---------- Share card: a 1080x1350 image of the player's result ---------- */
let cardCanvas=null;
function wrapText(c, text, maxW){
  const out=[]; let cur='';
  for(const w of text.split(' ')){
    const t=cur?cur+' '+w:w;
    if(c.measureText(t).width<=maxW){ cur=t; continue; }
    if(cur) out.push(cur);
    cur=w;
    while(c.measureText(cur).width>maxW){            // a single phrase wider than the card: break between whole characters
      const g=[...new Intl.Segmenter('km',{granularity:'grapheme'}).segment(cur)].map(x=>x.segment); let k=g.length;
      while(k>1 && c.measureText(g.slice(0,k).join('')).width>maxW) k--;
      out.push(g.slice(0,k).join('')); cur=g.slice(k).join('');
    }
  }
  if(cur) out.push(cur); return out;
}

/* Keep the eyes-reveal clip alive behind both fresh and restored readings. */
function startReadingVideo(){
  const video=$('#fateVid');
  video.onended=null; // The one-time story completion callback must not repeat.
  video.muted=true;
  video.loop=true;
  video.playsInline=true;
  video.classList.add('on');
  if(video.ended){ try{ video.currentTime=0; }catch(_){} }
  video.play().catch(()=>{
    // Mobile browsers may require a gesture when restoring a saved result.
    const retry=()=>{
      document.removeEventListener('pointerdown', retry);
      document.removeEventListener('keydown', retry);
      if($('#reading').classList.contains('on')) video.play().catch(()=>{});
    };
    document.addEventListener('pointerdown', retry, {once:true});
    document.addEventListener('keydown', retry, {once:true});
  });
}

/* ---------- Particles: candle embers + incense smoke ---------- */
const SHOW_EMBERS=false;   // floating gold candle embers turned off
const cv=$('#fx'), cx=cv.getContext('2d'); let W,H,P=[];
function size(){ W=cv.width=cv.offsetWidth*devicePixelRatio; H=cv.height=cv.offsetHeight*devicePixelRatio; }
addEventListener('resize', size); size();
function spawn(){
  const smoke=Math.random()<.35;
  P.push({ x:W*(.3+Math.random()*.4), y:H*(.75+Math.random()*.2), vx:(Math.random()-.5)*.3, vy:-(.3+Math.random()*.8)*devicePixelRatio,
           r:(smoke?14+Math.random()*20:1+Math.random()*2)*devicePixelRatio, life:1, smoke });
}
(function tick(){
  cx.clearRect(0,0,W,H);
  if(SHOW_EMBERS && P.length<70) spawn();
  for(const p of P){
    p.x+=p.vx+Math.sin((p.y+p.r)/60)*.25; p.y+=p.vy; p.life-=p.smoke?.003:.005;
    cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7);
    cx.fillStyle=p.smoke?`rgba(200,180,160,${.035*p.life})`:`rgba(255,${170+Math.random()*60|0},90,${.8*p.life})`;
    cx.fill();
  }
  P=P.filter(p=>p.life>0&&p.y>-50);
  requestAnimationFrame(tick);
})();

/* ---------- Synthesized ambience (no audio files needed) ---------- */
const sfx={ ctx:null,
  start(){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); this.night(); /* this.music(); */ }catch(e){} },   // background music turned off
  /* Background music (assets/music.mp3), kept quiet under the wind. MUSIC_VOL: 0 = silent, 1 = full volume */
  music(){
    const MUSIC_VOL=0.10, a=new Audio('assets/music.mp3'); a.loop=true; a.preload='auto'; this.track=a;
    if(location.protocol==='file:'){   // opened from the zip: plain volume control works on computers
      a.volume=0; a.play().catch(()=>{}); let v=0; const up=setInterval(()=>{ v=Math.min(MUSIC_VOL, v+MUSIC_VOL/40); a.volume=v; if(v>=MUSIC_VOL) clearInterval(up); }, 150); return;
    }
    const c=this.ctx, g=c.createGain(), t=c.currentTime;   // through Web Audio so the volume also applies on iPhones
    c.createMediaElementSource(a).connect(g).connect(c.destination);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(MUSIC_VOL,t+6); a.play().catch(()=>{});
  },
  /* Walking into the house (matches the 12 s walk-in video): rain on the veranda, slow footsteps on wet then dry wood, the door creaking */
  enter(){
    const c=this.ctx; if(!c) return; const t0=c.currentTime, bus=c.createGain(); bus.gain.value=0.55; bus.connect(c.destination); this.enterBus=bus;
    const ENTER_VOL=1;   // footsteps, door and rain together: 0 = silent
    bus.gain.value=0.55*ENTER_VOL;
    const noiseBuf=(sec)=>{ const b=c.createBuffer(1,c.sampleRate*sec,c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; };
    // rain outside: loud on the veranda, fading as you go deeper inside
    const rain=c.createBufferSource(), rf=c.createBiquadFilter(), rg=c.createGain(); rain.buffer=noiseBuf(3); rain.loop=true;
    rf.type='bandpass'; rf.frequency.value=2600; rf.Q.value=.5;
    rg.gain.setValueAtTime(0,t0); rg.gain.linearRampToValueAtTime(.16,t0+1); rg.gain.setValueAtTime(.16,t0+3); rg.gain.linearRampToValueAtTime(.05,t0+7); rg.gain.linearRampToValueAtTime(0,t0+14);
    rain.connect(rf).connect(rg).connect(bus); rain.start(t0); rain.stop(t0+14);
    // one footstep: a soft heel thud on a hollow wooden floor (wet = a little splash on top)
    const step=(t,wet,vol)=>{
      const o=c.createOscillator(), og=c.createGain(); o.type='sine'; o.frequency.setValueAtTime(120+Math.random()*25,t); o.frequency.exponentialRampToValueAtTime(55,t+.16);
      og.gain.setValueAtTime(0,t); og.gain.linearRampToValueAtTime(.55*vol,t+.008); og.gain.exponentialRampToValueAtTime(.0001,t+.22); o.connect(og).connect(bus); o.start(t); o.stop(t+.25);
      const n=c.createBufferSource(), nf=c.createBiquadFilter(), ng=c.createGain(); n.buffer=noiseBuf(.3);
      nf.type='bandpass'; nf.frequency.value=wet?1800:700; nf.Q.value=wet?.8:1.4;
      ng.gain.setValueAtTime(0,t); ng.gain.linearRampToValueAtTime((wet?.22:.14)*vol,t+.01); ng.gain.exponentialRampToValueAtTime(.0001,t+(wet?.18:.1)); n.connect(nf).connect(ng).connect(bus); n.start(t); n.stop(t+.3);
      if(Math.random()<.35){ const k=c.createOscillator(), kf=c.createBiquadFilter(), kg=c.createGain(), kt=t+.05;   // the old boards creak now and then
        k.type='sawtooth'; k.frequency.setValueAtTime(180+Math.random()*60,kt); k.frequency.linearRampToValueAtTime(140,kt+.35); kf.type='bandpass'; kf.frequency.value=900; kf.Q.value=8;
        kg.gain.setValueAtTime(0,kt); kg.gain.linearRampToValueAtTime(.035*vol,kt+.06); kg.gain.linearRampToValueAtTime(0,kt+.38); k.connect(kf).connect(kg).connect(bus); k.start(kt); k.stop(kt+.4); }
    };
    // slow steps every ~0.85 s; wet on the veranda, dry once through the door (~4 s), stopping at the table (~11 s)
    for(let s=.6, i=0; s<11; s+=.82+Math.random()*.12, i++) step(t0+s, s<3.8, (i%2?.85:1)*(s<3.8?.9:1));
    // the door: a long low creak as you pass through it
    const d=c.createOscillator(), df=c.createBiquadFilter(), dg=c.createGain(), dt=t0+2.6;
    d.type='sawtooth'; d.frequency.setValueAtTime(95,dt); d.frequency.linearRampToValueAtTime(140,dt+.7); d.frequency.linearRampToValueAtTime(82,dt+1.6);
    df.type='bandpass'; df.frequency.value=650; df.Q.value=7; dg.gain.setValueAtTime(0,dt); dg.gain.linearRampToValueAtTime(.09,dt+.2); dg.gain.setValueAtTime(.09,dt+1.3); dg.gain.linearRampToValueAtTime(0,dt+1.8);
    d.connect(df).connect(dg).connect(bus); d.start(dt); d.stop(dt+1.9);
  },
  stopEnter(){ const b=this.enterBus; if(!b||!this.ctx) return; this.enterBus=null; const t=this.ctx.currentTime; b.gain.cancelScheduledValues(t); b.gain.setValueAtTime(b.gain.value,t); b.gain.linearRampToValueAtTime(0,t+.8); setTimeout(()=>b.disconnect(),1000); },
  /* Horror night ambience, all generated in the browser: howling wind with gusts, a low uneasy drone, and rare distant creaks */
  night(){
    const WIND_VOL=0.10;   // wind, drone and creaks together: 0 = silent, 1 = full
    const c=this.ctx, t=c.currentTime, out=c.createGain(); out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(WIND_VOL,t+4); out.connect(c.destination); this.out=out;
    const noise=()=>{ const b=c.createBuffer(1,c.sampleRate*4,c.sampleRate), d=b.getChannelData(0); let last=0;
      for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.5; }   // brown noise: deep, airy
      const s=c.createBufferSource(); s.buffer=b; s.loop=true; s.start(); return s; };
    const lfo=(rate,depth,target)=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=rate; g.gain.value=depth; o.connect(g).connect(target); o.start(); };
    // 1. low wind rumble
    const r=noise(), rf=c.createBiquadFilter(), rg=c.createGain(); rf.type='lowpass'; rf.frequency.value=220; rg.gain.value=.55; r.connect(rf).connect(rg).connect(out); lfo(.07,.25,rg.gain);
    // 2. two howling wind voices: narrow band-pass whose pitch wanders, left and right
    [[-.6,.11,520],[.6,.083,760]].forEach(([pan,rate,f])=>{
      const s=noise(), bp=c.createBiquadFilter(), g=c.createGain(), p=c.createStereoPanner();
      bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=9; g.gain.value=.22; p.pan.value=pan;
      s.connect(bp).connect(g).connect(p).connect(out); lfo(rate,f*.45,bp.frequency); lfo(rate*1.7,.16,g.gain); });
    // 3. uneasy drone: two low tones a little out of tune, slowly beating
    [49,51.6,73.4].forEach((f,i)=>{ const o=c.createOscillator(), g=c.createGain(); o.type='sine'; o.frequency.value=f; g.gain.value=i<2?.05:.022; o.connect(g).connect(out); o.start(); });
    // 4. gusts and distant creaks at random moments
    const gust=()=>{ if(!this.ctx) return; const n=c.currentTime, s=noise(), bp=c.createBiquadFilter(), g=c.createGain();
      bp.type='bandpass'; bp.Q.value=4; bp.frequency.setValueAtTime(300,n); bp.frequency.linearRampToValueAtTime(950+Math.random()*500,n+2.2); bp.frequency.linearRampToValueAtTime(260,n+5);
      g.gain.setValueAtTime(0,n); g.gain.linearRampToValueAtTime(.42,n+2); g.gain.linearRampToValueAtTime(0,n+5.5);
      s.connect(bp).connect(g).connect(out); setTimeout(()=>s.stop(),6000); setTimeout(gust, 9000+Math.random()*14000); };
    const creak=()=>{ if(!this.ctx) return; const n=c.currentTime, o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain();
      o.type='sawtooth'; o.frequency.setValueAtTime(62+Math.random()*20,n); o.frequency.linearRampToValueAtTime(48+Math.random()*12,n+1.4);
      f.type='bandpass'; f.frequency.value=420; f.Q.value=6; g.gain.setValueAtTime(0,n); g.gain.linearRampToValueAtTime(.05,n+.25); g.gain.linearRampToValueAtTime(0,n+1.6);
      o.connect(f).connect(g).connect(out); o.start(n); o.stop(n+1.7); setTimeout(creak, 18000+Math.random()*22000); };
    setTimeout(gust, 3500); setTimeout(creak, 12000);
  },
  chime(vol){ return;   // bell sound turned off
 const c=this.ctx; if(!c) return; const t=c.currentTime;
    [523,1046,1568].forEach((f,i)=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=f*(1+Math.random()*.003);
      g.gain.setValueAtTime(vol*.12/(i+1),t); g.gain.exponentialRampToValueAtTime(.0001,t+4); o.connect(g).connect(c.destination); o.start(t); o.stop(t+4); }); }
};

/* Card ring motion, driven by script so it always runs: beads clockwise, extra lotus points counter-clockwise, gold shine circling */
(function ringLoop(){
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(t){
    const svg=document.querySelector('#reading .ringFx');
    if(svg && !still){
      const a=(t/20000*360)%360, R=' 150.3 150.3)';
      svg.querySelector('.inner')?.setAttribute('transform','rotate('+a+R);
      svg.querySelector('.points2')?.setAttribute('transform','rotate('+(-a)+R);
      const g=(t/8000*360)%360;
      svg.querySelectorAll('#rg0,#rg1').forEach(el=>el.setAttribute('gradientTransform','rotate('+g+R));
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
